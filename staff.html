<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الموظف | المخبر الذكي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh;">

  <div class="staff-container card" style="width: 100%; max-width: 500px; padding: 40px;">
    <div style="text-align: center; margin-bottom: 30px;">
      <h2 style="color: var(--primary-dark);">👨‍⚕️ لوحة موظف الاستقبال</h2>
      <p style="color: var(--text-muted); font-size: 14px;">(نسخة تجريبية للديمو فقط)</p>
    </div>

    <form id="staffForm">
      <div class="form-group">
        <label>رقم حجز المريض (للديمو: 123)</label>
        <input type="text" id="staffPatientId" class="form-control ltr-input" value="123" required>
      </div>
      
      <div class="form-group">
        <label>اسم المريض</label>
        <input type="text" id="staffPatientName" class="form-control" value="أحمد محمد" required>
      </div>

      <div class="form-group">
        <label>تحديث حالة العينة</label>
        <select id="staffStatus" class="form-control">
          <option value="1">1 - تم استلام العينة</option>
          <option value="2">2 - قيد التحليل</option>
          <option value="3">3 - النتيجة جاهزة</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">تحديث حالة المريض</button>
    </form>

    <div id="staffSuccess" style="display: none; margin-top: 20px; padding: 15px; background: #dcfce7; color: #166534; border-radius: 8px; text-align: center; font-weight: bold;">
      ✅ تم تحديث حالة المريض بنجاح! روح لصفحة التتبع وجرب رقم 123.
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="results.html" target="_blank" style="color: var(--primary); font-weight: 600; text-decoration: underline;">فتح صفحة المريض (في تاب جديد)</a>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
